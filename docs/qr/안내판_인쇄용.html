<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코딩 마을 안내판</title>
<style>
  @page { size: A4; margin: 14mm; }

  :root {
    --ink: #2b2118;
    --soft: #7d6c5c;
    --line: #e0d6c6;
    --accent: #3d7a38;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f4f1ea;
    color: var(--ink);
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .sheet {
    width: 182mm;
    min-height: 260mm;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 6mm;
    padding: 18mm 16mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6mm;
  }

  .show {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 11pt;
    letter-spacing: .08em;
    color: var(--accent);
  }

  h1 {
    font-size: 30pt;
    line-height: 1.25;
    margin: 0;
    text-wrap: balance;
  }

  .lead {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 12.5pt;
    line-height: 1.75;
    color: var(--soft);
    margin: 0;
    max-width: 130mm;
    text-wrap: balance;
  }

  .qrBox {
    border: 1.5px solid var(--line);
    border-radius: 4mm;
    padding: 6mm;
    background: #fff;
  }

  .qr { width: 82mm; height: 82mm; display: block; }

  .url {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11pt;
    color: var(--soft);
    letter-spacing: .01em;
  }

  .steps {
    list-style: none;
    margin: 2mm 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3mm;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 11.5pt;
    color: var(--ink);
    text-align: left;
    max-width: 120mm;
    width: 100%;
  }

  .steps li {
    display: flex;
    gap: 4mm;
    align-items: baseline;
  }

  .steps b {
    color: var(--accent);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5pt;
  }

  footer {
    margin-top: auto;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 10pt;
    color: var(--soft);
  }

  @media print {
    body { background: #fff; padding: 0; }
    .sheet { border: 0; border-radius: 0; width: auto; min-height: auto; padding: 0; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="show">스튜디오 시선 전시</div>

    <h1>경민T의 작은 코딩 마을</h1>

    <p class="lead">
      휴대폰 카메라로 아래 그림을 비추면 마을로 들어갑니다.
      길을 따라 올라가며 세 곳을 들러 보세요.
    </p>

</div>

    <div class="url">codingvillage.vercel.app</div>

    <ul class="steps">
      <li><b>1</b><span>마을 도서관에서 오늘의 문장을 한 줄 받아 가세요.</span></li>
      <li><b>2</b><span>작은 행복정원에 오늘의 작은 기쁨을 심어 보세요.</span></li>
      <li><b>3</b><span>꽃 우체국에서 학생 한 명에게 꽃과 한 마디를 놓아 주세요.</span></li>
    </ul>

    <p class="lead" style="font-size:11pt">
      세 곳을 다 돌면 도장이 채워지고, 완주 카드를 받아 갈 수 있어요.
    </p>

    <footer>스튜디오 시선 전시 · 경민T의 작은 코딩 마을</footer>
  </div>
</body>
</html>
